<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClipSync AI — Pro CapCut Desktop Studio</title>
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #080b11; color: #f1f5f9; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function ClipSyncApp() {
      const [key1, setKey1] = useState(localStorage.getItem('clipsync_primary_key') || '');
      const [key2, setKey2] = useState(localStorage.getItem('clipsync_secondary_key') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [savedAlert, setSavedAlert] = useState(false);
      
      const [refUrl, setRefUrl] = useState('');
      const [analyzing, setAnalyzing] = useState(false);
      const [refAnalyzed, setRefAnalyzed] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      
      const [chatMessages, setChatMessages] = useState([
        { sender: 'ai', text: 'Namaste! Main ClipSync AI hoon. Reference video ka link daliye aur mujhe Hinglish ya English mein batayein kaise edit karna hai.' }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [pendingDiff, setPendingDiff] = useState(null);

      const canvasRef = useRef(null);

      // Save keys
      const saveKeys = () => {
        localStorage.setItem('clipsync_primary_key', key1);
        localStorage.setItem('clipsync_secondary_key', key2);
        setSavedAlert(true);
        setTimeout(() => setSavedAlert(false), 3000);
      };

      // Mock Timeline Data
      const [shots, setShots] = useState([
        { id: 'shot_1', in: '00:00.000', out: '00:02.400', cut: 'Fast Zoom', match: 'folder_A/groom_entry_01.mp4', cutout: 'Groom Cutout', speed: '2.0x -> 0.5x' },
        { id: 'shot_2', in: '00:02.400', out: '00:04.100', cut: 'Flash Beat', match: 'folder_B/bride_smile_04.mp4', cutout: 'Bride Cutout', speed: '1.0x Normal' },
        { id: 'shot_3', in: '00:04.100', out: '00:06.800', cut: 'Smooth Pan', match: 'folder_C/couple_stage_02.mp4', cutout: 'Couple Cutout', speed: '0.5x Slowmo' }
      ]);

      // Canvas Real-Time Render Simulation
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let frameId;

        const render = () => {
          ctx.fillStyle = '#05070d';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          // Split View: Left Reference / Right User Match
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(canvas.width / 2, 0);
          ctx.lineTo(canvas.width / 2, canvas.height);
          ctx.stroke();

          // Left Side - Reference Feed
          ctx.fillStyle = '#64748b';
          ctx.font = '11px sans-serif';
          ctx.fillText('REFERENCE TIMING & BEATS (ORIGINAL)', 20, 25);
          ctx.fillStyle = '#1e1b4b';
          ctx.fillRect(20, 40, canvas.width / 2 - 35, canvas.height - 60);
          ctx.fillStyle = '#a5b4fc';
          ctx.font = '12px sans-serif';
          ctx.fillText(refAnalyzed ? 'Shot 1: Beat Cut Synced (124 BPM)' : 'No Reference Loaded', 40, canvas.height / 2);

          // Right Side - User Matched Footage with Cutout
          ctx.fillStyle = '#64748b';
          ctx.fillText('USER MATCHED CLIPS (CAPCUT PREVIEW)', canvas.width / 2 + 15, 25);
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(canvas.width / 2 + 15, 40, canvas.width / 2 - 35, canvas.height - 60);

          // Draw Simulated Wedding Cutout Overlay
          ctx.fillStyle = '#ec4899';
          ctx.beginPath();
          ctx.arc(canvas.width * 0.75, canvas.height / 2 - 10, 50, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Groom + Bride Cutout Layer', canvas.width * 0.75, canvas.height / 2 + 55);
          ctx.textAlign = 'left';

          if (isPlaying) {
            setCurrentTime(prev => (prev + 0.03 > 6.8 ? 0 : prev + 0.03));
          }
          frameId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(frameId);
      }, [isPlaying, refAnalyzed]);

      // Chatbot Handle Hinglish
      const handleSendChat = () => {
        if (!inputMsg.trim()) return;
        const userText = inputMsg;
        setChatMessages(prev => [...prev, { sender: 'user', text: userText }]);
        setInputMsg('');

        setTimeout(() => {
          if (userText.toLowerCase().includes('cutout') || userText.toLowerCase().includes('groom') || userText.toLowerCase().includes('bride')) {
            setPendingDiff({
              title: 'Apply Wedding Cutouts Plan',
              desc: 'Shot 1 aur Shot 3 par AI Subject Cutout aur Golden Rim Glow enable karein?',
              action: () => {
                alert('Cutouts timeline par apply ho gaye!');
                setPendingDiff(null);
              }
            });
            setChatMessages(prev => [...prev, { sender: 'ai', text: 'Maine wedding cutouts ka plan bana liya hai. Neeche diye card se Approve kijiye.' }]);
          } else {
            setChatMessages(prev => [...prev, { sender: 'ai', text: `Aapke instruction: "${userText}" ke according timeline modify kar di gayi hai.` }]);
          }
        }, 800);
      };

      const handleAnalyze = () => {
        if (!refUrl) { alert('Pehle YouTube ya Instagram link daalein'); return; }
        setAnalyzing(true);
        setTimeout(() => {
          setAnalyzing(false);
          setRefAnalyzed(true);
          alert('Reference video analyze ho gaya! 3 cuts aur 124 BPM rhythm detect huyi hai.');
        }, 1500);
      };

      // CapCut Export Bridge
      const exportCapCutJSON = () => {
        const draft = {
          app: "CapCut Desktop Bridge",
          version: "2.0",
          media: shots.map(s => ({ shot: s.id, file: s.match, in: s.in, out: s.out, speed: s.speed, cutout: s.cutout }))
        };
        const blob = new Blob([JSON.stringify(draft, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "ClipSync_CapCut_Draft.json";
        a.click();
      };

      return (
        <div className="flex flex-col h-screen select-none">
          {/* Top Navbar */}
          <header className="h-12 bg-[#0d121f] border-b border-gray-800 flex items-center justify-between px-4">
            <div className="flex items-center gap-3">
              <span className="font-bold text-indigo-400 text-sm tracking-wide">CLIPSYNC AI</span>
              <span className="text-[10px] bg-indigo-950 text-indigo-300 px-2 py-0.5 rounded border border-indigo-800">CapCut Studio v1.0</span>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={() => setShowSettings(!showSettings)} className="text-xs bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded border border-gray-700">
                ⚙️ API Settings
              </button>
              <button onClick={exportCapCutJSON} className="text-xs bg-indigo-600 hover:bg-indigo-500 font-semibold px-3 py-1.5 rounded text-white shadow">
                Export to CapCut
              </button>
            </div>
          </header>

          {/* Settings Modal */}
          {showSettings && (
            <div className="absolute inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center">
              <div className="bg-[#121826] border border-gray-700 rounded-xl p-5 w-96 shadow-2xl">
                <h3 className="text-sm font-bold text-white mb-3">AI API Credentials</h3>
                <label className="text-[11px] text-gray-400 block mb-1">Primary Model Key (GPT-4o / Claude)</label>
                <input type="password" value={key1} onChange={e=>setKey1(e.target.value)} className="w-full bg-[#080b11] border border-gray-700 rounded px-2.5 py-1.5 text-xs text-white mb-3 focus:outline-none focus:border-indigo-500" />
                <label className="text-[11px] text-gray-400 block mb-1">Secondary Key (Multimodal Vision / Scene)</label>
                <input type="password" value={key2} onChange={e=>setKey2(e.target.value)} className="w-full bg-[#080b11] border border-gray-700 rounded px-2.5 py-1.5 text-xs text-white mb-4 focus:outline-none focus:border-indigo-500" />
                <div className="flex justify-between items-center">
                  <button onClick={saveKeys} className="bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold px-4 py-1.5 rounded text-white">Save Keys</button>
                  <button onClick={() => setShowSettings(false)} className="text-xs text-gray-400 hover:text-white">Close</button>
                </div>
                {savedAlert && <p className="text-[11px] text-emerald-400 mt-2">✓ Keys saved successfully!</p>}
              </div>
            </div>
          )}

          {/* Main 3-Column Layout */}
          <div className="flex flex-1 overflow-hidden">
            {/* Left Column: Media & Reference Analysis */}
            <div className="w-72 bg-[#0e1322] border-r border-gray-800 flex flex-col p-3 gap-3 overflow-y-auto">
              <div className="bg-[#141b2d] p-3 rounded-lg border border-gray-800">
                <span className="text-xs font-bold text-gray-300 block mb-2">1. Reference Video URL</span>
                <input type="text" placeholder="Paste YouTube / Instagram Link" value={refUrl} onChange={e=>setRefUrl(e.target.value)} className="w-full bg-[#090d16] border border-gray-700 rounded px-2 py-1.5 text-xs text-white mb-2" />
                <button onClick={handleAnalyze} className="w-full bg-slate-800 hover:bg-slate-700 text-xs py-1.5 rounded font-medium text-indigo-300 border border-slate-700">
                  {analyzing ? 'Analyzing Beats & Cuts...' : 'Detect Cuts & Timing'}
                </button>
              </div>

              <div className="bg-[#141b2d] p-3 rounded-lg border border-gray-800 flex-1 flex flex-col">
                <span className="text-xs font-bold text-gray-300 block mb-2">2. Imported Media Folders</span>
                <div className="space-y-2 text-xs text-gray-400 flex-1 overflow-y-auto">
                  <div className="p-2 bg-[#090d16] rounded border border-gray-800 flex justify-between">
                    <span>📁 folder_A_Groom_Baraat</span>
                    <span className="text-[10px] text-emerald-400">12 clips</span>
                  </div>
                  <div className="p-2 bg-[#090d16] rounded border border-gray-800 flex justify-between">
                    <span>📁 folder_B_Bride_Entry</span>
                    <span className="text-[10px] text-emerald-400">8 clips</span>
                  </div>
                  <div className="p-2 bg-[#090d16] rounded border border-gray-800 flex justify-between">
                    <span>📁 folder_C_Couple_Stage</span>
                    <span className="text-[10px] text-emerald-400">15 clips</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Middle Column: Live Compositor & Timeline */}
            <div className="flex-1 flex flex-col bg-[#05070d]">
              {/* Canvas Preview */}
              <div className="flex-1 flex flex-col items-center justify-center p-3 relative">
                <canvas ref={canvasRef} width={640} height={320} className="rounded-lg shadow-2xl border border-gray-800"></canvas>
                <div className="flex items-center gap-4 mt-3">
                  <button onClick={() => setIsPlaying(!isPlaying)} className="bg-indigo-600 hover:bg-indigo-500 text-xs px-4 py-1.5 rounded-full font-bold">
                    {isPlaying ? '⏸ Pause' : '▶ Play Synced Preview'}
                  </button>
                  <span className="text-xs text-gray-400 font-mono">Time: 00:0{currentTime.toFixed(2)}s / 00:06.80s</span>
                </div>
              </div>

              {/* Multi-Track NLE Timeline */}
              <div className="h-48 bg-[#0a0e1a] border-t border-gray-800 p-2 flex flex-col gap-1.5">
                <div className="text-[11px] text-gray-500 font-semibold px-2 flex justify-between">
                  <span>TIMELINE (CAPCUT SYNCED MULTI-TRACK)</span>
                  <span className="text-indigo-400">Rhythm: 124 BPM</span>
                </div>

                {/* Track V2: Cutouts */}
                <div className="h-8 bg-[#0f1526] rounded flex items-center px-2 relative border border-gray-800/80">
                  <span className="text-[10px] text-gray-400 w-16">V2 Cutout</span>
                  <div className="absolute left-20 w-32 h-6 bg-pink-700/80 rounded border border-pink-500 flex items-center justify-center text-[10px] font-bold text-white">Groom Cutout</div>
                  <div className="absolute left-56 w-28 h-6 bg-purple-700/80 rounded border border-purple-500 flex items-center justify-center text-[10px] font-bold text-white">Bride Cutout</div>
                  <div className="absolute left-88 w-44 h-6 bg-fuchsia-700/80 rounded border border-fuchsia-500 flex items-center justify-center text-[10px] font-bold text-white">Couple Cutout</div>
                </div>

                {/* Track V1: User Clips */}
                <div className="h-8 bg-[#0f1526] rounded flex items-center px-2 relative border border-gray-800/80">
                  <span className="text-[10px] text-gray-400 w-16">V1 Clips</span>
                  <div className="absolute left-20 w-32 h-6 bg-blue-700/80 rounded border border-blue-500 flex items-center justify-center text-[10px] text-white">groom_entry_01</div>
                  <div className="absolute left-56 w-28 h-6 bg-blue-600/80 rounded border border-blue-500 flex items-center justify-center text-[10px] text-white">bride_smile_04</div>
                  <div className="absolute left-88 w-44 h-6 bg-indigo-700/80 rounded border border-indigo-500 flex items-center justify-center text-[10px] text-white">couple_stage_02</div>
                </div>

                {/* Track A1: Audio Beats */}
                <div className="h-8 bg-[#0f1526] rounded flex items-center px-2 relative border border-gray-800/80">
                  <span className="text-[10px] text-gray-400 w-16">A1 Audio</span>
                  <div className="absolute left-20 right-4 h-6 bg-emerald-950/60 rounded border border-emerald-600 flex items-center justify-around text-[10px] text-emerald-300">
                    <span>|||| Beat 1</span><span>|||| Beat 2</span><span>|||| Beat 3</span><span>|||| Beat 4</span><span>|||| Beat 5</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Right Column: Hinglish AI Chatbox */}
            <div className="w-80 bg-[#0e1322] border-l border-gray-800 flex flex-col">
              <div className="p-3 border-b border-gray-800 text-xs font-bold text-gray-300">
                AI Editing Assistant (Hinglish/English)
              </div>
              <div className="flex-1 p-3 overflow-y-auto space-y-3">
                {chatMessages.map((m, idx) => (
                  <div key={idx} className={`p-2.5 rounded-lg text-xs leading-relaxed ${m.sender === 'user' ? 'bg-indigo-600 text-white ml-6' : 'bg-[#182033] text-gray-200 mr-6 border border-gray-700'}`}>
                    {m.text}
                  </div>
                ))}

                {/* Diff Approval Card */}
                {pendingDiff && (
                  <div className="bg-amber-950/40 border border-amber-600/60 p-3 rounded-lg text-xs space-y-2">
                    <span className="font-bold text-amber-300 block">{pendingDiff.title}</span>
                    <p className="text-gray-300">{pendingDiff.desc}</p>
                    <div className="flex gap-2 pt-1">
                      <button onClick={pendingDiff.action} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1 rounded text-[11px]">Approve & Apply</button>
                      <button onClick={() => setPendingDiff(null)} className="bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded text-[11px]">Reject</button>
                    </div>
                  </div>
                )}
              </div>

              <div className="p-3 border-t border-gray-800 flex gap-2">
                <input
                  type="text"
                  placeholder='e.g. "Groom aur Bride cutout lagao"'
                  value={inputMsg}
                  onChange={e=>setInputMsg(e.target.value)}
                  onKeyDown={e=>e.key === 'Enter' && handleSendChat()}
                  className="flex-1 bg-[#090d16] border border-gray-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                />
                <button onClick={handleSendChat} className="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-xs font-bold text-white">Send</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ClipSyncApp />);
  </script>
</body>
</html>
