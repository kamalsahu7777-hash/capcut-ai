<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClipSync AI — Native CapCut Studio</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #06090e; color: #f3f4f6; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #0c121e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { ipcRenderer } = window.require ? window.require('electron') : { ipcRenderer: null };

    const CAPCUT_TRANSITION_LIBRARY = [
      { id: 'tr_zoom_in', name: 'Zoom In', category: 'Camera', duration: 0.4, intensity: 1.0, capcutId: 'transition_zoom_in_01' },
      { id: 'tr_zoom_out', name: 'Zoom Out', category: 'Camera', duration: 0.4, intensity: 1.0, capcutId: 'transition_zoom_out_01' },
      { id: 'tr_whip_pan_r', name: 'Whip Pan Right', category: 'Motion Blur', duration: 0.3, intensity: 1.2, capcutId: 'transition_whip_right' },
      { id: 'tr_whip_pan_l', name: 'Whip Pan Left', category: 'Motion Blur', duration: 0.3, intensity: 1.2, capcutId: 'transition_whip_left' },
      { id: 'tr_flash_white', name: 'Flash White', category: 'Light', duration: 0.25, intensity: 1.5, capcutId: 'transition_white_flash' },
      { id: 'tr_glitch_chroma', name: 'Chroma Glitch', category: 'Glitch', duration: 0.35, intensity: 0.8, capcutId: 'transition_chroma_glitch' },
      { id: 'tr_shake_impact', name: 'Camera Shake Impact', category: 'Action', duration: 0.3, intensity: 1.4, capcutId: 'effect_shake_heavy' },
      { id: 'tr_speed_ramp', name: 'Speed Curve (Hero Flow)', category: 'Speed', duration: 0.6, curve: [0.2, 2.5, 0.4, 1.0], capcutId: 'curve_hero_speed' }
    ];

    function App() {
      const [folders, setFolders] = useState([]);
      const [importedFiles, setImportedFiles] = useState([]);
      const [includeSubfolders, setIncludeSubfolders] = useState(true);
      const [scanning, setScanning] = useState(false);
      const [scanProgress, setScanProgress] = useState('');

      const [refUrl, setRefUrl] = useState('');
      const [refPlatform, setRefPlatform] = useState(null);
      const [audioFile, setAudioFile] = useState(null);
      const [bpm, setBpm] = useState(124);
      const [detectedBeats, setDetectedBeats] = useState([]);
      const [isAnalyzingAudio, setIsAnalyzingAudio] = useState(false);

      const [editingMode, setEditingMode] = useState('ai');
      const [timelineClips, setTimelineClips] = useState([]);
      const [selectedTransition, setSelectedTransition] = useState(CAPCUT_TRANSITION_LIBRARY[0]);
      const [activeClipIndex, setActiveClipIndex] = useState(0);

      const waveformCanvasRef = useRef(null);

      const extractVideoMetadata = (fileObj) => {
        return new Promise((resolve) => {
          const video = document.createElement('video');
          video.preload = 'metadata';
          video.src = 'file://' + fileObj.fullPath;
          video.onloadedmetadata = () => {
            resolve({
              duration: video.duration || 0,
              width: video.videoWidth || 1920,
              height: video.videoHeight || 1080,
              fps: 30
            });
          };
          video.onerror = () => {
            resolve({ duration: 0, width: 1920, height: 1080, fps: 30 });
          };
        });
      };

      const handleImportFolders = async () => {
        if (!ipcRenderer) {
          alert('Desktop Electron environment not detected.');
          return;
        }
        setScanning(true);
        setScanProgress('Folders scan ho rahe hain...');
        try {
          const res = await ipcRenderer.invoke('select-folders', { includeSubfolders });
          if (!res.canceled && res.folders.length > 0) {
            let newlyFoundFiles = [];
            for (const f of res.folders) {
              newlyFoundFiles.push(...f.files);
            }

            const existingPaths = new Set(importedFiles.map(x => x.fullPath));
            const uniqueNew = newlyFoundFiles.filter(x => !existingPaths.has(x.fullPath));

            setScanProgress(`${uniqueNew.length} files analyze ho rahi hain...`);
            const enriched = [];
            for (let i = 0; i < uniqueNew.length; i++) {
              const item = uniqueNew[i];
              if (item.type === 'video') {
                const meta = await extractVideoMetadata(item);
                enriched.push({ ...item, ...meta });
              } else {
                enriched.push({ ...item, duration: 0, width: 0, height: 0, fps: 0 });
              }
            }

            setFolders(prev => [...prev, ...res.folders.map(x => ({ folderName: x.folderName, folderPath: x.folderPath, count: x.files.length }))]);
            setImportedFiles(prev => [...prev, ...enriched]);
          }
        } catch (err) {
          console.error(err);
        } finally {
          setScanning(false);
          setScanProgress('');
        }
      };

      const removeFolder = (folderPath) => {
        setFolders(prev => prev.filter(f => f.folderPath !== folderPath));
        setImportedFiles(prev => prev.filter(file => !file.fullPath.startsWith(folderPath)));
      };

      useEffect(() => {
        if (!refUrl) { setRefPlatform(null); return; }
        if (refUrl.includes('youtube.com') || refUrl.includes('youtu.be')) {
          setRefPlatform(refUrl.includes('/shorts/') ? 'YouTube Shorts' : 'YouTube Video');
        } else if (refUrl.includes('instagram.com')) {
          setRefPlatform(refUrl.includes('/reel/') ? 'Instagram Reel' : 'Instagram Video');
        } else {
          setRefPlatform('Direct Web Stream');
        }
      }, [refUrl]);

      const handleAudioFileImport = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsAnalyzingAudio(true);
        setAudioFile(file.name);

        try {
          const arrayBuffer = await file.arrayBuffer();
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const decoded = await audioCtx.decodeAudioData(arrayBuffer);

          drawWaveform(decoded);

          const rawData = decoded.getChannelData(0);
          const sampleRate = decoded.sampleRate;
          const peaks = [];
          const step = Math.floor(sampleRate * 0.25);

          for (let i = 0; i < rawData.length; i += step) {
            let sum = 0;
            for (let j = 0; j < step && i + j < rawData.length; j++) {
              sum += Math.abs(rawData[i + j]);
            }
            const energy = sum / step;
            if (energy > 0.18) {
              peaks.push((i / sampleRate));
            }
          }

          if (peaks.length > 2) {
            let intervals = [];
            for (let k = 1; k < peaks.length; k++) intervals.push(peaks[k] - peaks[k - 1]);
            const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
            const calculatedBpm = Math.round(60 / (avgInterval || 0.5));
            setBpm(calculatedBpm > 60 && calculatedBpm < 200 ? calculatedBpm : 124);
          }
          setDetectedBeats(peaks.slice(0, 16));
        } catch (err) {
          console.error("Audio decode error:", err);
        } finally {
          setIsAnalyzingAudio(false);
        }
      };

      const drawWaveform = (buffer) => {
        const canvas = waveformCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const data = buffer.getChannelData(0);
        const step = Math.ceil(data.length / canvas.width);
        const amp = canvas.height / 2;

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, amp);

        for (let i = 0; i < canvas.width; i++) {
          let min = 1.0;
          let max = -1.0;
          for (let j = 0; j < step; j++) {
            const datum = data[(i * step) + j];
            if (datum < min) min = datum;
            if (datum > max) max = datum;
          }
          ctx.lineTo(i, (1 + min) * amp);
          ctx.lineTo(i, (1 + max) * amp);
        }
        ctx.stroke();
      };

      const runAiSmartEdit = () => {
        const videoClips = importedFiles.filter(f => f.type === 'video');
        if (videoClips.length === 0) {
          alert('Pehle apne PC se video clips import kijiye!');
          return;
        }

        const beatPoints = detectedBeats.length > 0 ? detectedBeats : [0.0, 1.8, 3.4, 5.2, 7.0, 8.8, 10.5];
        const newTimeline = [];

        for (let i = 0; i < beatPoints.length - 1; i++) {
          const assignedClip = videoClips[i % videoClips.length];
          const startTime = beatPoints[i];
          const endTime = beatPoints[i + 1];
          const duration = endTime - startTime;
          const transition = CAPCUT_TRANSITION_LIBRARY[i % CAPCUT_TRANSITION_LIBRARY.length];

          newTimeline.push({
            id: 'clip_' + (i + 1),
            sourcePath: assignedClip.fullPath,
            fileName: assignedClip.name,
            inPoint: 0.0,
            outPoint: duration,
            timelineStart: startTime,
            timelineEnd: endTime,
            duration: duration,
            transition: transition,
            speedRamp: i % 2 === 0 ? '2.0x -> 0.5x' : '1.0x Normal'
          });
        }
        setTimelineClips(newTimeline);
      };

      const handleExportCapCut = async () => {
        if (!ipcRenderer) return;

        if (timelineClips.length === 0) {
          alert('Timeline khali hai! Pehle "Run AI Smart Edit" karein.');
          return;
        }

        const capcutDraftJSON = {
          app_version: "5.0.0",
          platform: "windows",
          tracks: [
            {
              id: "track_main_video_v1",
              type: "video",
              segments: timelineClips.map((c, idx) => ({
                id: c.id,
                material_id: "mat_vid_" + idx,
                source_timerange: { start: Math.round(c.inPoint * 1000000), duration: Math.round(c.duration * 1000000) },
                target_timerange: { start: Math.round(c.timelineStart * 1000000), duration: Math.round(c.duration * 1000000) },
                path: c.sourcePath,
                extra_meta: {
                  transition_name: c.transition.name,
                  capcut_effect_id: c.transition.capcutId,
                  speed_curve: c.speedRamp
                }
              }))
            }
          ],
          materials: {
            videos: timelineClips.map((c, idx) => ({
              id: "mat_vid_" + idx,
              path: c.sourcePath,
              type: "video"
            })),
            transitions: timelineClips.map(c => ({
              name: c.transition.name,
              capcut_id: c.transition.capcutId,
              duration: c.transition.duration
            }))
          }
        };

        const res = await ipcRenderer.invoke('export-capcut-draft', {
          draftData: capcutDraftJSON,
          projectName: 'ClipSync_' + (refPlatform ? refPlatform.replace(/\s+/g, '_') : 'Project')
        });

        if (res.success) {
          alert(res.message);
        } else {
          alert('Error: ' + res.error);
        }
      };

      return (
        <div className="flex flex-col h-screen text-xs select-none">
          <header className="h-12 bg-[#0c101a] border-b border-gray-800 flex items-center justify-between px-4">
            <div className="flex items-center gap-3">
              <span className="font-extrabold text-indigo-400 tracking-wider text-sm">CLIPSYNC AI</span>
              <span className="bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-0.5 rounded text-[10px]">
                CapCut Desktop Agent
              </span>
            </div>
            
            <div className="flex items-center gap-4">
              <div className="flex bg-[#141b2d] rounded p-0.5 border border-gray-700">
                <button 
                  onClick={() => setEditingMode('manual')}
                  className={`px-3 py-1 rounded text-[11px] font-semibold transition ${editingMode === 'manual' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}>
                  Manual Mode
                </button>
                <button 
                  onClick={() => setEditingMode('ai')}
                  className={`px-3 py-1 rounded text-[11px] font-semibold transition ${editingMode === 'ai' ? 'bg-indigo-600 text-white' : 'text-gray-400 hover:text-white'}`}>
                  AI Auto Edit Mode
                </button>
              </div>

              <button 
                onClick={handleExportCapCut}
                className="bg-emerald-600 hover:bg-emerald-500 font-bold text-white px-4 py-1.5 rounded shadow flex items-center gap-1.5">
                ⚡ Inject to CapCut PC
              </button>
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden">
            <div className="w-80 bg-[#0a0d16] border-r border-gray-800 flex flex-col p-3 gap-3 overflow-y-auto">
              <div className="flex justify-between items-center">
                <span className="font-bold text-gray-200">Local Media Folders</span>
                <span className="text-[10px] text-gray-400">Total: {importedFiles.length} files</span>
              </div>

              <label className="flex items-center gap-1.5 text-[10px] text-gray-400 cursor-pointer">
                <input 
                  type="checkbox" 
                  checked={includeSubfolders} 
                  onChange={e => setIncludeSubfolders(e.target.checked)} 
                  className="rounded bg-gray-900 border-gray-700 text-indigo-600"
                />
                Scan Subfolders
              </label>

              <button 
                onClick={handleImportFolders} 
                disabled={scanning}
                className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded font-semibold transition">
                📂 Import PC Folders
              </button>

              {scanning && (
                <div className="text-[10px] text-indigo-300 animate-pulse bg-indigo-950/40 p-1.5 rounded border border-indigo-900">
                  {scanProgress}
                </div>
              )}

              <div className="space-y-1.5 max-h-36 overflow-y-auto border-b border-gray-800 pb-2">
                {folders.map((f, i) => (
                  <div key={i} className="flex justify-between items-center p-1.5 bg-[#121826] rounded border border-gray-800">
                    <span className="truncate w-44 font-mono text-[10px] text-gray-300">📁 {f.folderName}</span>
                    <div className="flex items-center gap-2">
                      <span className="text-[9px] bg-gray-800 px-1.5 py-0.5 rounded text-gray-400">{f.count} clips</span>
                      <button onClick={() => removeFolder(f.folderPath)} className="text-red-400 hover:text-red-300">✕</button>
                    </div>
                  </div>
                ))}
              </div>

              <span className="font-bold text-gray-300 text-[11px] pt-1">Imported Clips List</span>
              <div className="flex-1 space-y-1.5 overflow-y-auto pr-1">
                {importedFiles.map((file, idx) => (
                  <div key={idx} className="p-2 bg-[#101624] rounded border border-gray-800/80 flex flex-col gap-1 hover:border-gray-700">
                    <div className="flex justify-between items-center">
                      <span className="truncate w-48 font-medium text-gray-200">{file.name}</span>
                      <span className="text-[9px] text-indigo-400 uppercase">{file.ext.replace('.', '')}</span>
                    </div>
                    <div className="flex justify-between text-[10px] text-gray-400 font-mono">
                      <span>{file.duration ? `${file.duration.toFixed(1)}s` : 'Analyzing...'}</span>
                      <span>{file.width}x{file.height}</span>
                      <span>{(file.sizeBytes / (1024 * 1024)).toFixed(1)}MB</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex-1 flex flex-col bg-[#05070d]">
              <div className="p-3 bg-[#0c101a] border-b border-gray-800 flex items-center gap-3">
                <input 
                  type="text" 
                  placeholder="Paste YouTube Video / Shorts or Instagram Reel URL here..."
                  value={refUrl}
                  onChange={e => setRefUrl(e.target.value)}
                  className="flex-1 bg-[#06080e] border border-gray-700 rounded px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500"
                />
                {refPlatform && (
                  <span className="bg-emerald-950 text-emerald-300 border border-emerald-800 px-2.5 py-1 rounded text-[11px] font-semibold whitespace-nowrap">
                    Detected: {refPlatform}
                  </span>
                )}
                <label className="bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded cursor-pointer border border-gray-600 whitespace-nowrap">
                  Load Audio / Music
                  <input type="file" accept="audio/*,video/*" onChange={handleAudioFileImport} className="hidden" />
                </label>
              </div>

              <div className="px-4 py-2 bg-[#090d16] border-b border-gray-800">
                <div className="flex justify-between text-[10px] text-gray-400 mb-1">
                  <span>Audio Waveform & Beat Spectrum</span>
                  <span className="text-indigo-400 font-mono">Detected BPM: {bpm} | Major Beat Points: {detectedBeats.length}</span>
                </div>
                <canvas ref={waveformCanvasRef} width={800} height={40} className="rounded border border-gray-800 w-full"></canvas>
              </div>

              <div className="flex-1 flex flex-col items-center justify-center p-4">
                <div className="w-[620px] h-[340px] bg-[#0c101b] rounded-lg border border-gray-800 flex flex-col items-center justify-center relative overflow-hidden shadow-2xl">
                  <div className="absolute top-3 left-3 flex gap-2">
                    <span className="bg-black/60 px-2 py-0.5 rounded text-[10px] text-gray-400 border border-gray-700">
                      Active: {timelineClips[activeClipIndex] ? timelineClips[activeClipIndex].fileName : 'No Clip Selected'}
                    </span>
                    <span className="bg-indigo-950/80 px-2 py-0.5 rounded text-[10px] text-indigo-300 border border-indigo-800">
                      CapCut FX: {timelineClips[activeClipIndex] ? timelineClips[activeClipIndex].transition.name : 'None'}
                    </span>
                  </div>

                  <span className="text-indigo-400 font-bold text-sm tracking-wide">
                    REAL-TIME EDIT PREVIEW
                  </span>

                  <button 
                    onClick={runAiSmartEdit}
                    className="mt-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2 rounded-lg shadow-lg flex items-center gap-2">
                    ⚡ Run AI Smart Edit (Sync with Audio Beats)
                  </button>
                </div>
              </div>

              <div className="h-44 bg-[#090d16] border-t border-gray-800 p-2.5 flex flex-col justify-between">
                <div className="flex justify-between items-center text-[10px] text-gray-400">
                  <span>CAPCUT SEQUENCED TRACK (V1 + TRANSITIONS)</span>
                  <span>Total Duration: {timelineClips.reduce((a, b) => a + b.duration, 0).toFixed(2)}s</span>
                </div>

                <div className="flex-1 flex items-center gap-1.5 overflow-x-auto py-2">
                  {timelineClips.map((clip, idx) => (
                    <div 
                      key={idx}
                      onClick={() => setActiveClipIndex(idx)}
                      className={`h-16 min-w-[130px] rounded p-2 flex flex-col justify-between cursor-pointer border transition ${
                        activeClipIndex === idx ? 'bg-indigo-900/60 border-indigo-400' : 'bg-[#121827] border-gray-800'
                      }`}>
                      <div className="flex justify-between text-[10px]">
                        <span className="font-bold text-white truncate w-16">{clip.fileName}</span>
                        <span className="text-emerald-400 font-mono">{clip.duration.toFixed(1)}s</span>
                      </div>
                      <div className="bg-indigo-950/90 border border-indigo-800/80 rounded px-1 py-0.5 text-[9px] text-indigo-300 truncate">
                        FX: {clip.transition.name}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="w-80 bg-[#0a0d16] border-l border-gray-800 flex flex-col p-3 gap-3 overflow-y-auto">
              <span className="font-bold text-gray-200">CapCut Transition Library</span>
              <p className="text-[10px] text-gray-400">
                AI matches these transitions based on Reference Video style patterns.
              </p>

              <div className="space-y-1.5 flex-1 overflow-y-auto">
                {CAPCUT_TRANSITION_LIBRARY.map((tr) => (
                  <div 
                    key={tr.id}
                    onClick={() => {
                      setSelectedTransition(tr);
                      if (timelineClips[activeClipIndex]) {
                        const updated = [...timelineClips];
                        updated[activeClipIndex].transition = tr;
                        setTimelineClips(updated);
                      }
                    }}
                    className={`p-2 rounded border cursor-pointer flex justify-between items-center transition ${
                      selectedTransition.id === tr.id ? 'bg-indigo-950/80 border-indigo-500' : 'bg-[#101624] border-gray-800 hover:border-gray-700'
                    }`}>
                    <div>
                      <div className="font-semibold text-gray-200">{tr.name}</div>
                      <div className="text-[9px] text-gray-400">Category: {tr.category}</div>
                    </div>
                    <span className="text-[10px] font-mono text-indigo-400">{tr.duration}s</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
